name: Performance Testing CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  performance-gate:
    name: Execute Headless Locust & Evaluate SLA Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests for Quality Gate Logic
        run: |
          pytest -v tests/

      - name: Launch Target Mock Banking API
        run: |
          nohup uvicorn target_api.server:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          # Wait for API health check
          timeout 15 bash -c 'until curl -s http://localhost:8000/health; do sleep 1; done'

      - name: Run Headless Locust Load Test
        run: |
          mkdir -p reports
          locust -f perf_suite/locustfile.py \
            --headless \
            --users 25 \
            --spawn-rate 5 \
            --run-time 20s \
            --host http://localhost:8000 \
            --csv=reports/perf \
            --html=reports/performance-report.html

      - name: Evaluate Performance Quality Gate
        run: |
          python perf_suite/gate_runner.py perf_suite/thresholds.json reports/perf_stats.csv

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-gate-report
          path: reports/
          retention-days: 14
